version: 2
updates:
  - package-ecosystem: nuget
    # the library, the tests and the dotnet tools manifest
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # one PR for all minor/patch bumps
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # majors usually need code changes, so they come apart from minor/patch
      nuget-major:
        patterns:
          - "*"
        update-types:
          - major
      # security fixes (mostly transitive deps) in a single PR too
      nuget-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: dotnet-sdk
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # a new .NET major is a runtime-floor change, made by hand
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
