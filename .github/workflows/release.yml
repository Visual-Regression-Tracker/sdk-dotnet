name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      version: ${{ steps.semantic-release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test --configuration Release
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the release tooling
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Build, tag and draft the GitHub release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx semantic-release
      - uses: actions/upload-artifact@v7
        if: steps.semantic-release.outputs.version
        with:
          name: package
          path: artifacts
          if-no-files-found: error

  publish:
    needs: release
    if: needs.release.outputs.version
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: artifacts
      - name: Log in to NuGet with trusted publishing
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish to NuGet
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  github-release:
    needs: [release, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
