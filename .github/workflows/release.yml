name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Check the tag matches the package version
        run: |
          version=$(dotnet msbuild VisualRegressionTracker -getProperty:Version)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$version</Version> in VisualRegressionTracker.csproj"
            exit 1
          fi
      - name: Extract release notes
        run: |
          mkdir -p artifacts
          awk -v version="$GITHUB_REF_NAME" '{ sub(/\r$/, "") } /^## / { section = ($2 == version); next } section' CHANGELOG.md > artifacts/release-notes.md
          if ! grep -q '[^[:space:]]' artifacts/release-notes.md; then
            echo "::error::CHANGELOG.md has no '## $GITHUB_REF_NAME' section"
            exit 1
          fi
      - name: Test
        run: dotnet test --configuration Release
      - name: Pack
        run: dotnet pack VisualRegressionTracker --configuration Release --no-build --output artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: artifacts
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: artifacts
      - name: Log in to NuGet with trusted publishing
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish to NuGet
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file artifacts/release-notes.md "${prerelease[@]}"
